<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
            <title>Tic Tac Toe</title>
            <style>
              #board {
                display: grid;
                grid-template-columns: repeat(3, 80px);
                gap: 6px;
                width: fit-content;
              }
              #board button {
                width: 80px;
                height: 80px;
                font-size: 40px;
              }
            </style>
    </head>
<body>
<h1>Tic Tac Toe</h1>
<div id="board"></div>
<script>
    const boardDiv = document.getElementById("board");
    for (let i = 0; i < 9; i++) {
      const btn = document.createElement("button");
      btn.textContent = "";
      boardDiv.appendChild(btn);
    }
</script>
</body>
</html>
